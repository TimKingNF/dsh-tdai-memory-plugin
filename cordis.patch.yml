- insert:
    - id: tdai-memory
      name: dsh-tdai-memory-plugin
      inject: [tools, systemPrompt, sessions]
      config:
        endpoint: !!js process.env.TDAI_MEMORY_ENDPOINT || 'http://127.0.0.1:8420'
        apiKeyEnv: !!js process.env.TDAI_MEMORY_API_KEY_ENV || 'TDAI_MEMORY_API_KEY'
        serviceId: !!js process.env.TDAI_MEMORY_INSTANCE_ID || ''
        teamId: !!js process.env.TDAI_MEMORY_TEAM_ID || ''
        agentId: !!js process.env.TDAI_MEMORY_AGENT_ID || ''
        userId: !!js process.env.TDAI_MEMORY_USER_ID || ''
        userKey: !!js process.env.TDAI_MEMORY_USER_KEY || ''
        knowledgeEndpoint: !!js process.env.TDAI_MEMORY_KNOWLEDGE_ENDPOINT || ''
        taskId: !!js process.env.TDAI_MEMORY_TASK_ID || ''
        enabled: !!js process.env.TDAI_MEMORY_ENABLED ?? ''
        recallEnabled: !!js process.env.TDAI_MEMORY_RECALL_ENABLED ?? ''
        injectionEnabled: !!js process.env.TDAI_MEMORY_INJECTION_ENABLED ?? ''
        captureEnabled: !!js process.env.TDAI_MEMORY_CAPTURE_ENABLED ?? ''
        taskWriteEnabled: !!js process.env.TDAI_MEMORY_TASK_WRITE_ENABLED ?? ''
        sessionContextEnabled: !!js process.env.TDAI_MEMORY_SESSION_CONTEXT_ENABLED ?? ''
        agentPromptEnabled: !!js process.env.TDAI_MEMORY_AGENT_PROMPT_ENABLED ?? ''
        agentPromptKeepBase: !!js process.env.TDAI_MEMORY_AGENT_PROMPT_KEEP_BASE ?? ''
        profileMemoryEnabled: !!js process.env.TDAI_MEMORY_PROFILE_MEMORY_ENABLED ?? ''
        skillsEnabled: !!js process.env.TDAI_MEMORY_SKILLS_ENABLED ?? ''
        knowledgeEnabled: !!js process.env.TDAI_MEMORY_KNOWLEDGE_ENABLED ?? ''
        subagentInjectionEnabled: !!js process.env.TDAI_MEMORY_SUBAGENT_INJECTION_ENABLED ?? ''
        subagentCaptureEnabled: !!js process.env.TDAI_MEMORY_SUBAGENT_CAPTURE_ENABLED ?? ''
        # ds-bot 会话（方案 docs/proposals/ds-bot-tdai-integration/minimal.md）
        # 总闸 + 两个子开关 + 群聊蒸馏参数 + 台账路径；有效值只在 lib/dsbot.mjs 计算。
        dsbotAwarenessEnabled: !!js process.env.TDAI_MEMORY_DSBOT_AWARENESS_ENABLED ?? ''
        botSkillInjectEnabled: !!js process.env.TDAI_MEMORY_BOT_SKILL_INJECT_ENABLED ?? ''
        botWritebackEnabled: !!js process.env.TDAI_MEMORY_BOT_WRITEBACK_ENABLED ?? ''
        botContextDistillEnabled: !!js process.env.TDAI_MEMORY_BOT_CONTEXT_DISTILL_ENABLED ?? ''
        botContextMessages: !!js process.env.TDAI_MEMORY_BOT_CONTEXT_MESSAGES ?? ''
        botContextReuseMemory: !!js process.env.TDAI_MEMORY_BOT_CONTEXT_REUSE_MEMORY ?? ''
        botContextModel: !!js process.env.TDAI_MEMORY_BOT_CONTEXT_MODEL ?? ''
        botContextMaxTokens: !!js process.env.TDAI_MEMORY_BOT_CONTEXT_MAX_TOKENS ?? ''
        botContextTimeoutMs: !!js process.env.TDAI_MEMORY_BOT_CONTEXT_TIMEOUT_MS ?? ''
        dsbotLedgerPath: !!js process.env.TDAI_MEMORY_DSBOT_LEDGER_PATH ?? ''
        recallLimit: !!js process.env.TDAI_MEMORY_RECALL_LIMIT ?? ''
        skillRecallLimit: !!js process.env.TDAI_MEMORY_SKILL_RECALL_LIMIT ?? ''
        skillRecallMinScore: !!js process.env.TDAI_MEMORY_SKILL_RECALL_MIN_SCORE ?? ''
        l2Limit: !!js process.env.TDAI_MEMORY_L2_LIMIT ?? ''
        timeoutMs: !!js process.env.TDAI_MEMORY_TIMEOUT_MS ?? ''
        recallTimeoutMs: !!js process.env.TDAI_MEMORY_RECALL_TIMEOUT_MS ?? ''
        assetLoadBudgetMs: !!js process.env.TDAI_MEMORY_ASSET_LOAD_BUDGET_MS ?? ''
        assetRetryCooldownMs: !!js process.env.TDAI_MEMORY_ASSET_RETRY_COOLDOWN_MS ?? ''
